<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dota Buddy — тест-карта альфы для OBS</title>
<style>
  /* Фон страницы прозрачен: композитить должен OBS, а не браузер. */
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    width: 1920px; height: 1080px;
    font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #888;
    -webkit-font-smoothing: antialiased;
  }

  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #111; color: #ccc; }
  .bar button { font: inherit; padding: 4px 10px; cursor: pointer; }
  .bar code { color: #6cf; font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }

  .cell { border-right: 1px solid rgba(128,128,128,.25); border-bottom: 1px solid rgba(128,128,128,.25); }
  .cell h2 { margin: 0; padding: 6px 10px; font-size: 12px; font-weight: 600; color: #aaa; background: rgba(0,0,0,.55); }

  /* Две половины: слева подложка внутри страницы, справа чистая прозрачность. */
  .pair { display: grid; grid-template-columns: 1fr 1fr; height: 150px; }
  .half { position: relative; display: grid; place-items: center; }
  .half::after {
    position: absolute; left: 4px; bottom: 2px;
    font-size: 10px; color: rgba(128,128,128,.9);
  }
  .half.in-page::after { content: 'Chromium'; }
  .half.transparent::after { content: 'OBS'; }
  .half.in-page { background: var(--backdrop); }

  /* ---- образцы ---- */
  .solid      { width: 96px; height: 56px; background: #e0912f; }
  .a75        { width: 96px; height: 56px; background: rgba(224,145,47,.75); }
  .a50        { width: 96px; height: 56px; background: rgba(224,145,47,.50); }
  .a25        { width: 96px; height: 56px; background: rgba(224,145,47,.25); }
  .a10        { width: 96px; height: 56px; background: rgba(224,145,47,.10); }
  .radial     { width: 120px; height: 120px; background: radial-gradient(circle, #e0912f 0%, rgba(224,145,47,0) 70%); }
  .linear     { width: 120px; height: 56px; background: linear-gradient(90deg, #e0912f, rgba(224,145,47,0)); }
  .glow       { width: 56px; height: 56px; background: #e0912f; box-shadow: 0 0 28px 10px rgba(224,145,47,.85); }
  .circle     { width: 96px; height: 96px; border-radius: 50%; background: #e0912f; }
  .rounded    { width: 96px; height: 56px; border-radius: 10px; background: #e0912f; }
  .hairlines  { display: grid; gap: 9px; }
  .hairlines i { display: block; width: 120px; background: #e0912f; }
  .diag       { width: 120px; height: 56px; background: linear-gradient(72deg, transparent 49%, #e0912f 49%, #e0912f 51%, transparent 51%); }
  .ring       { width: 96px; height: 96px; border-radius: 50%; border: 2px solid #e0912f; }
  .type       { text-align: center; color: #e0912f; }
  .type b { display: block; font-weight: 600; }
  .white      { width: 96px; height: 56px; background: #fff; }
  .whitea50   { width: 96px; height: 56px; background: rgba(255,255,255,.5); }
</style>
</head>
<body>

<div class="bar">
  <strong>Тест-карта альфы</strong>
  <span>Подложка:</span>
  <button data-bg="#ffffff">белая</button>
  <button data-bg="#808080">серая</button>
  <button data-bg="#000000">чёрная</button>
  <button data-bg="#1e6f3c">зелёная</button>
  <span>В OBS под источник положить Color Source ровно этого цвета:</span>
  <code id="hex">#808080</code>
  <span>— левая половина каждой пары должна совпасть с правой.</span>
</div>

<div class="grid" id="grid"></div>

<script>
  const SAMPLES = [
    ['Сплошная заливка (контроль)',            '<i class="solid"></i>'],
    ['Альфа 75%',                              '<i class="a75"></i>'],
    ['Альфа 50%',                              '<i class="a50"></i>'],
    ['Альфа 25%',                              '<i class="a25"></i>'],
    ['Альфа 10%',                              '<i class="a10"></i>'],
    ['Белая заливка 100%',                     '<i class="white"></i>'],
    ['Белая заливка 50%',                      '<i class="whitea50"></i>'],
    ['Радиальный градиент в прозрачность',     '<i class="radial"></i>'],
    ['Линейный градиент в прозрачность',       '<i class="linear"></i>'],
    ['box-shadow / свечение',                  '<i class="glow"></i>'],
    ['Сглаженный край: круг',                  '<i class="circle"></i>'],
    ['Сглаженный край: скругление 10px',       '<i class="rounded"></i>'],
    ['Тонкие линии 1 / 2 / 3 px',              '<span class="hairlines"><i style="height:1px"></i><i style="height:2px"></i><i style="height:3px"></i></span>'],
    ['Диагональ (сглаживание под углом)',      '<i class="diag"></i>'],
    ['Обводка 2px',                            '<i class="ring"></i>'],
    ['Текст 11 / 14 / 28 px',                  '<span class="type"><b style="font-size:11px">Дота 123</b><b style="font-size:14px">Дота 123</b><b style="font-size:28px">Дота 123</b></span>'],
  ]

  document.getElementById('grid').innerHTML = SAMPLES.map(([title, html]) => `
    <div class="cell">
      <h2>${title}</h2>
      <div class="pair">
        <div class="half in-page">${html}</div>
        <div class="half transparent">${html}</div>
      </div>
    </div>`).join('')

  function setBackdrop(hex) {
    document.documentElement.style.setProperty('--backdrop', hex)
    document.getElementById('hex').textContent = hex
  }
  setBackdrop('#808080')
  document.querySelectorAll('.bar button').forEach(b =>
    b.addEventListener('click', () => setBackdrop(b.dataset.bg)))
</script>
</body>
</html>
