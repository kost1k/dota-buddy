// Dota Buddy - шаблон конфига Game State Integration
//
// Куда положить:
//   ...\Steam\steamapps\common\dota 2 beta\game\dota\cfg\gamestate_integration\
//
// Обязательно: добавить -gamestateintegration в параметры запуска Dota 2.
//
// Значения timeout/buffer/throttle/heartbeat - см. docs/research/gsi-data-surface.md
"Dota Buddy Integration"
{
    "uri"           "http://127.0.0.1:3000/api/gsi"

    // Сколько клиент ждёт HTTP-ответ, прежде чем считать запрос неудачным.
    "timeout"       "5.0"

    // Пауза на склейку дельт перед отправкой. Ненулевая рекомендуется Valve:
    // игровые события идут пачками.
    "buffer"        "0.05"

    // Пауза после получения 2XX. ВАЖНО: отсчитывается от момента ОТВЕТА
    // сервера, поэтому задержка обработчика складывается с этим интервалом.
    // Потолок ~10 пакетов/сек; на практике наблюдают ~1 Гц.
    "throttle"      "0.1"

    // Пинг даже когда данные не менялись - для детекта разрыва.
    "heartbeat"     "10.0"

    "auth"
    {
        // Должен совпадать с NUXT_GSI_SECRET. Пустой секрет на сервере
        // отключает проверку.
        "token"     "change-me"
    }

    "data"
    {
        // --- доступно обычному игроку ---
        "provider"      "1"
        "map"           "1"    // у игрока урезанный набор полей
        "player"        "1"    // ТОЛЬКО свой игрок
        "hero"          "1"    // ТОЛЬКО свой герой
        "abilities"     "1"
        "items"         "1"
        "buildings"     "1"    // только своя команда
        "wearables"     "1"
        "events"        "1"    // доходит ли до игрока - не подтверждено

        // --- только наблюдателю; у игрока просто не придут ---
        "draft"         "1"
        "league"        "1"
        "minimap"       "1"
        "roshan"        "1"
        "couriers"      "1"
        "neutralitems"  "1"
    }
}
